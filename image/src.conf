# src.conf - what goes into the router's FreeBSD base system.
#
# Used ONLY by image/build-image.sh (passed with SRCCONF=...); the build
# machine's own /etc/src.conf is never read or changed.
#
# Goal: a small appliance base. Everything removed here is something a router
# does not need. Careful: WITHOUT_xxx=<anything> removes xxx (even "=no"), so
# delete a line to keep a component instead of changing its value.

# --- developer tools: the router never compiles anything ---
WITHOUT_TOOLCHAIN=yes
WITHOUT_TESTS=yes
WITHOUT_DEBUG_FILES=yes
WITHOUT_LIB32=yes
WITHOUT_LLVM_COV=yes

# --- documentation / desktop leftovers ---
WITHOUT_HTML=yes
WITHOUT_SHAREDOCS=yes
WITHOUT_EXAMPLES=yes
WITHOUT_GAMES=yes
WITHOUT_CALENDAR=yes
WITHOUT_DICT=yes

# --- services a router appliance does not run ---
WITHOUT_BLUETOOTH=yes
WITHOUT_LPR=yes
WITHOUT_FINGER=yes
WITHOUT_TALK=yes
WITHOUT_NIS=yes
WITHOUT_HAST=yes
WITHOUT_BSNMP=yes
WITHOUT_UNBOUND=yes
WITHOUT_RBOOTD=yes
WITHOUT_SENDMAIL=yes
WITHOUT_ISCSI=yes

# --- KEEP: never add WITHOUT_ for these ---
# OPENSSL, OPENSSH, PAM, KERBEROS  packages and sshd link against them
# PF, INET, INET6, NETGRAPH        the router itself
# ZFS, CDDL, CTF                   the installer offers ZFS; the kernel build uses CTF tools
# BSDINSTALL, DIALOG, BSDCONFIG    the installer on the USB stick is built from this world
# NTP, PPP, BOOT, EFI, LOADER_LUA  time sync, PPPoE, booting
# MAIL (dma)                       periodic(8) mails its daily reports to root
# AT                               /etc/crontab runs atrun
# LOCALES, ICONV                   python needs them
