# /usr/local/etc/doas.conf (root:wheel 0600) - installed by setup/install.sh
#
# The 'router' account may run exactly one program as root: the router-cli
# backend. doas resets the environment (no 'keepenv'); router-apply re-parses
# and re-validates every request (JSON schema + regex whitelists) itself.
permit nopass router as root cmd /usr/local/libexec/router-apply
